<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🅿️ みんなの駐車場マップ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>" />
  <meta name="description" content="みんなで作る駐車場マップ。周辺の駐車場と料金を地図で探して、最安値を見つけよう。" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=20260729e" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand">🅿️ みんなの駐車場マップ</h1>
      <div class="topbar-actions">
        <button id="rank-chip" class="rank-chip hidden" title="あなたの貢献ランク">🥉 ブロンズ<span class="rank-pts">0pt</span></button>
        <button id="btn-login" class="icon-btn">ログイン / 登録</button>
        <button id="btn-logout" class="icon-btn hidden" title="ログアウト">ログアウト</button>
        <button id="btn-refresh" class="icon-btn" title="この地図を更新">🔄 更新</button>
        <button id="btn-locate" class="icon-btn" title="現在地へ">📍 現在地</button>
        <button id="btn-add" class="primary-btn">＋ 駐車場を登録</button>
      </div>
    </header>

    <main class="layout">
      <div id="map"></div>
    </main>

    <div id="add-hint" class="add-hint hidden">
      地図をタップして駐車場の位置を指定してください
      <button id="btn-cancel-add" class="link-btn">キャンセル</button>
    </div>

    <!-- 目立たない位置に規約リンク -->
    <a class="terms-link" href="terms.html" target="_blank" rel="noopener">利用規約</a>
  </div>

  <!-- 登録/編集フォーム モーダル -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">駐車場を登録</h2>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>
      <form id="lot-form">
        <input type="hidden" name="id" />
        <input type="hidden" name="lat" />
        <input type="hidden" name="lng" />
        <!-- ハニーポット: 人間は触らない。bot が入力すると弾く -->
        <div class="hp-field" aria-hidden="true">
          <label>サイト<input name="website" tabindex="-1" autocomplete="off" /></label>
        </div>

        <label class="field">
          <span>駐車場名 <em class="req">必須</em></span>
          <input name="name" type="text" maxlength="120" placeholder="例: ○○コインパーキング" required />
        </label>

        <div class="field">
          <span>料金 <em class="hint-inline">（看板どおりに行を足せます）</em></span>
          <div id="rate-rows" class="rate-rows"></div>
          <div class="add-rate-btns">
            <button type="button" id="btn-add-rate" class="add-rate-btn">＋ 料金を追加</button>
            <button type="button" id="btn-add-rate-window" class="add-rate-btn">＋ 時間帯料金（夜間など）</button>
          </div>
        </div>

        <label class="field">
          <span>料金メモ（任意）</span>
          <input name="fee_note" type="text" maxlength="500" placeholder="例: 夜間20時〜8時は最大500円 / 最初30分無料" />
        </label>

        <label class="field">
          <span>台数（任意）</span>
          <input name="capacity" type="number" min="0" inputmode="numeric" placeholder="例: 20" />
        </label>

        <label class="field">
          <span>住所・目印（任意）</span>
          <input name="address" type="text" maxlength="200" placeholder="例: ○○市△△町1-2-3" />
        </label>

        <label class="field">
          <span>料金看板の写真 <em class="req">必須</em> <em class="hint-inline">（情報の根拠になります）</em></span>
          <input id="photo-input" name="photo" type="file" accept="image/*" capture="environment" />
          <div id="photo-preview" class="photo-preview hidden"><img alt="プレビュー" /></div>
        </label>

        <p id="form-error" class="form-error hidden"></p>
        <p class="pos-note">位置: <span id="pos-label">—</span></p>

        <div class="modal-actions">
          <button type="button" id="btn-form-cancel" class="ghost-btn">キャンセル</button>
          <button type="submit" id="btn-submit" class="primary-btn">登録する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ログイン / 新規登録 -->
  <div id="auth" class="modal hidden">
    <div class="modal-card auth-card">
      <div class="modal-head">
        <h2 id="auth-title">ログイン</h2>
        <button id="auth-close" class="icon-btn">✕</button>
      </div>
      <p class="admin-lead" id="auth-lead">駐車場の登録・確認・報告にはログインが必要です。</p>
      <form id="auth-form">
        <label class="field" id="fld-username">
          <span>ニックネーム</span>
          <input name="username" type="text" maxlength="20" autocomplete="username" placeholder="例: よね" />
        </label>
        <label class="field" id="fld-email">
          <span>メールアドレス</span>
          <input name="email" type="email" autocomplete="email" placeholder="例: you@example.com" />
        </label>
        <label class="field" id="fld-password">
          <span>パスワード <em class="hint-inline" id="pw-hint">（6文字以上）</em></span>
          <input name="password" type="password" autocomplete="current-password" placeholder="パスワード" />
        </label>
        <!-- ハニーポット -->
        <div class="hp-field" aria-hidden="true"><label>サイト<input name="website" tabindex="-1" autocomplete="off" /></label></div>
        <p id="auth-error" class="form-error hidden"></p>
        <p id="auth-msg" class="auth-msg hidden"></p>
        <div class="modal-actions">
          <button type="submit" id="auth-submit" class="primary-btn">ログイン</button>
        </div>
      </form>
      <p class="auth-terms">登録・ログインで<a href="terms.html" target="_blank" rel="noopener">利用規約・プライバシー</a>に同意したものとみなします。</p>
      <p class="admin-note" id="auth-switch"></p>
      <p class="admin-note" id="auth-forgot"></p>
    </div>
  </div>

  <!-- プロフィール（貢献ランク） -->
  <div id="profile" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>あなたの貢献</h2>
        <button id="profile-close" class="icon-btn">✕</button>
      </div>
      <div class="profile-rank">
        <div id="profile-rank-label" class="profile-rank-label">🥉 ブロンズ</div>
        <div id="profile-points" class="profile-points">0 pt</div>
      </div>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="profile-next" class="profile-next"></p>

      <div class="profile-stats" id="profile-stats"></div>

      <h3 class="profile-h3">バッジ</h3>
      <div class="badge-grid" id="badge-grid"></div>

      <p class="profile-note">確認・登録・写真添付などで貢献するとランクが上がります。あなたが登録した情報を他の人が「✅正しい」と確認するとさらにポイントが入ります。</p>
    </div>
  </div>

  <!-- 写真拡大 -->
  <div id="lightbox" class="lightbox hidden"><img alt="料金看板" /></div>

  <div id="toast" class="toast hidden"></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="app.js?v=20260729f"></script>
</body>
</html>
